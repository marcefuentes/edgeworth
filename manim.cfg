[CLI]
media_dir = media
# One scene file only — no per-module folder under videos/.
video_dir = {media_dir}/videos/{quality}
images_dir = {media_dir}/images
output_file = edgeworth
# YouTube-grade defaults (1080p60). Override with -ql/-qm if needed.
frame_rate = 60
pixel_height = 1080
pixel_width = 1920
